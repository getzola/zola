# Hand-written facts about the workspace that cannot be derived from Cargo.toml.
# Everything derivable (dependencies, layering, test and bench targets) is read
# from the crate manifests by scripts/dev/repo_map.py — do not repeat it here.
#
# `docs/architecture/COMPONENTS.md` is generated from this file plus the
# manifests. Edit here, then run `scripts/dev.sh generate`.

[invariants]
# Edges that must never exist. Each one needs a reason a reviewer can check.
forbidden = [
  { from = "content", to = "markdown", reason = "content must stay renderer-agnostic; site/src/md_render.rs bridges the two" },
  { from = "config", to = "content", reason = "configuration is parsed before any content exists" },
  { from = "utils", to = "config", reason = "utils is a leaf helper crate shared by everything above it" },
]

[component.errors]
responsibility = "Thin re-export of anyhow (`Result`, `bail!`, `Context`) so every crate reports errors the same way."

[component.console]
responsibility = "Terminal output: notices, warnings, errors, build summaries. Printing only — no logic."

[component.utils]
responsibility = "Leaf helpers shared by everything: filesystem access via fs-err, globs, slugs, anchors, TOC, deserialization, build timings."
perf_notes = "Owns the output-directory clean and the static-tree copy, both serial today."

[component.config]
responsibility = "Parses zola.toml/config.toml and theme.toml, owns markdown/search/link-checker/taxonomy settings and the highlighting setup."
perf_notes = "Highlighting registry initialisation is fixed startup cost paid before any page is read."

[component.content]
responsibility = "The in-memory site: Page, Section, Taxonomy and the Library index (permalinks, translations, backlinks, colocated assets)."
perf_notes = "Library construction and page parsing are on the critical path of every build."

[component.render]
responsibility = "Rendering layer: the Renderer that calls Tera, pagination, and RenderCache, which pre-serializes the library once per build."
perf_notes = "RenderCache::build is a dominant CPU and memory phase on large sites."

[component.markdown]
responsibility = "Markdown to HTML: pulldown-cmark, heading anchors, TOC, summaries, syntax highlighting, internal-link resolution."
perf_notes = "Syntax highlighting dominates this crate's cost on sites with code blocks."

[component.search]
responsibility = "Search index generation (elasticlunr and fuse output formats)."

[component.imageproc]
responsibility = "Image resizing and format conversion plus the on-disk cache of processed images."

[component.link_checker]
responsibility = "External link validation with caching; internal-link checking lives in site."

[component.templates]
responsibility = "The Tera instance, built-in templates, and every custom function and filter exposed to templates."
perf_notes = "load_data and get_* functions run once per page; registration clones site state."

[component.site]
responsibility = "Orchestration: loads content, renders markdown, builds the render cache, turns every artifact into a Job and writes it out."
perf_notes = "Owns discovery, the output queue, output-directory cleaning and the static copy."
