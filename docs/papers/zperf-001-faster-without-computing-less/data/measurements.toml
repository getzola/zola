# Every figure printed in paper.md is declared here.
#
# A figure taken from a committed benchmark artifact carries `source` and
# `json_path`, and `scripts/dev.sh papers validate` re-extracts it and compares.
# A figure read off a terminal or a profiler carries `source_note` instead and is
# classed `observed`: the number is real, but no committed artifact holds it, and
# the paper says so.
#
# `text` is the exact string the paper prints. If the paper's prose drifts from
# the artifact, validation fails on the string, not on a rounding argument.

